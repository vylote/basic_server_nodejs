app = "basic-server-nodejs"
primary_region = "sin" # Hoặc khu vực gần bạn (Singapore)

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[processes]
  app = "node server.js"
